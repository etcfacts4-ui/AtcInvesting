<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATC Investing - Fund Lab</title>
<style>
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --accent: #0f766e;
  --header-bg: #0f172a;
  --border: #e2e8f0;
  --green: #10b981;
  --green-light: #d1fae5;
  --red: #ef4444;
  --red-light: #fee2e2;
  --yellow: #f59e0b;
  --yellow-light: #fef3c7;
  --blue-light: #dbeafe;
  --gray-light: #f8fafc;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
header {
  background: var(--header-bg);
  color: white;
  padding: 1.25rem 1.5rem 1.5rem;
}
.header-label { font-size: 0.75rem; letter-spacing: 0.08em; color: #94a3b8; margin-bottom: 0.25rem; }
h1 { margin: 0; font-size: 1.85rem; font-weight: 600; }
.subtitle { color: #cbd5e1; font-size: 0.95rem; margin: 0.4rem 0 1rem; }
.stats-row {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}
.stat-card {
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 0.75rem 1rem;
  min-width: 140px;
}
.stat-label { font-size: 0.75rem; color: #94a3b8; }
.stat-value { font-size: 1.5rem; font-weight: 700; margin-top: 0.15rem; }
.controls-row {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  align-items: center;
}
input, select, button {
  background: #1e293b;
  color: white;
  border: 1px solid #334155;
  padding: 0.55rem 0.9rem;
  border-radius: 8px;
  font-size: 0.9rem;
}
input::placeholder { color: #94a3b8; }
button {
  cursor: pointer;
  background: #0f766e;
  border: none;
  font-weight: 600;
}
button:hover { background: #0d9488; }
button.secondary { background: #334155; }
button.secondary:hover { background: #475569; }
.view-toggle { display: flex; gap: 0.4rem; }
main { padding: 1.25rem 1.5rem; }
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1rem;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.1rem;
  cursor: pointer;
  transition: box-shadow 0.15s, transform 0.15s;
}
.card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; }
.fund-name { font-weight: 700; font-size: 1rem; margin: 0; line-height: 1.3; }
.stars { color: #f59e0b; font-size: 0.85rem; }
.category { color: var(--muted); font-size: 0.82rem; margin: 0.3rem 0 0.7rem; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin: 0.6rem 0; }
.metric { text-align: center; }
.metric-label { font-size: 0.7rem; color: var(--muted); }
.metric-value { font-weight: 700; font-size: 1rem; }
.positive { color: var(--green); }
.negative { color: var(--red); }
.risk-badge {
  background: #f1f5f9;
  color: #334155;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  font-size: 0.88rem;
  border: 1px solid var(--border);
}
th, td { padding: 0.7rem 0.9rem; text-align: left; border-bottom: 1px solid var(--border); }
th { background: #f8fafc; cursor: pointer; user-select: none; font-weight: 600; }
tr:hover { background: #f8fafc; }
.sortable::after { content: ' ↕'; opacity: 0.4; font-size: 0.8em; }
.sorted-asc::after { content: ' ↑'; opacity: 1; }
.sorted-desc::after { content: ' ↓'; opacity: 1; }
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: none;
  align-items: flex-start;
  justify-content: center;
  z-index: 1000;
  padding: 1.5rem 1rem;
  overflow-y: auto;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white;
  border-radius: 16px;
  max-width: 720px;
  width: 100%;
  margin: auto;
  padding: 1.5rem 1.75rem 2rem;
  position: relative;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}
.close-btn {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: #f1f5f9;
  border: none;
  color: #475569;
  font-size: 0.85rem;
  cursor: pointer;
  padding: 0.4rem 0.8rem;
  border-radius: 8px;
  font-weight: 500;
}
.close-btn:hover { background: #e2e8f0; }
.ficha-label { font-size: 0.7rem; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.3rem; }
.modal h2 { margin: 0 0 0.2rem; font-size: 1.45rem; }
.meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.3rem; }
.gestor { font-size: 0.85rem; color: #475569; margin-bottom: 1.25rem; }
.section-title { font-weight: 700; font-size: 1rem; margin: 1.25rem 0 0.75rem; }
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.6rem;
  margin-bottom: 0.5rem;
}
@media (max-width: 640px) {
  .metrics-grid { grid-template-columns: repeat(2, 1fr); }
}
.metric-card {
  border-radius: 10px;
  padding: 0.65rem 0.7rem;
  text-align: center;
}
.metric-card .label { font-size: 0.7rem; color: #475569; margin-bottom: 0.15rem; }
.metric-card .value { font-weight: 700; font-size: 1.15rem; }
.bg-green { background: #d1fae5; }
.bg-green .value { color: #065f46; }
.bg-red { background: #fee2e2; }
.bg-red .value { color: #991b1b; }
.bg-yellow { background: #fef3c7; }
.bg-yellow .value { color: #92400e; }
.bg-light { background: #f8fafc; }
.bg-light .value { color: #1e293b; }
.bg-mint { background: #ecfdf5; }
.bg-mint .value { color: #047857; }
.bar-row {
  display: flex;
  align-items: center;
  margin: 0.35rem 0;
  font-size: 0.85rem;
}
.bar-label { width: 110px; flex-shrink: 0; color: #475569; }
.bar-track {
  flex: 1;
  height: 10px;
  background: #f1f5f9;
  border-radius: 5px;
  overflow: hidden;
  margin: 0 0.6rem;
}
.bar-fill {
  height: 100%;
  background: #10b981;
  border-radius: 5px;
}
.bar-value { width: 60px; text-align: right; font-weight: 600; font-size: 0.82rem; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="header-label">ATC INVESTING / FUND LAB</div>
  <h1>Tu universo de fondos.</h1>
  <div class="subtitle">Busca, explora y compara los datos de tu lista de seguimiento.</div>
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Fondos disponibles</div>
      <div class="stat-value" id="fund-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Categorías</div>
      <div class="stat-value" id="cat-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Datos del archivo</div>
      <div class="stat-value" style="font-size:1.1rem; padding-top:0.2rem;">01 oct 2026</div>
    </div>
  </div>
  <div class="controls-row">
    <input type="search" id="search" placeholder="Buscar fondo, ISIN, gestor o categoría" style="min-width: 260px; flex:1;">
    <select id="filter-category">
      <option value="">Todas las categorías</option>
    </select>
    <select id="filter-stars">
      <option value="0">Todas las estrellas</option>
      <option value="3">3+ estrellas</option>
      <option value="4">4+ estrellas</option>
      <option value="5">5 estrellas</option>
    </select>
    <div class="view-toggle">
      <button id="btn-cards">Tarjetas</button>
      <button id="btn-table" class="secondary">Tabla</button>
    </div>
  </div>
</header>

<main>
  <div id="cards-view" class="cards-grid"></div>
  <div id="table-view" class="hidden">
    <div style="overflow-x: auto;">
      <table id="funds-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="name">Fondo</th>
            <th class="sortable" data-sort="category">Categoría</th>
            <th class="sortable" data-sort="risk">Riesgo</th>
            <th class="sortable" data-sort="y1">1 Año</th>
            <th class="sortable" data-sort="y3">3 Años</th>
            <th class="sortable" data-sort="y5">5 Años</th>
            <th class="sortable" data-sort="sharpe">Sharpe</th>
            <th class="sortable" data-sort="stars">★</th>
            <th class="sortable" data-sort="vol">Vol.</th>
            <th>ISIN</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <button class="close-btn" id="close-modal">Cerrar ×</button>
    <div id="modal-content"></div>
  </div>
</div>

let currentView = 'cards';
let filtered = [...FUNDS];
let sortKey = 'y1';
let sortDir = 'desc';

const fmtPct = (v) => v == null ? '—' : (v * 100).toFixed(2).replace('.', ',') + ' %';
const fmtNum = (v, d=2) => v == null ? '—' : Number(v).toFixed(d).replace('.', ',');
const fmtInt = (v) => v == null ? '—' : Math.round(v).toLocaleString('es-ES');
const colorClass = (v) => v > 0 ? 'positive' : v < 0 ? 'negative' : '';

function getCategories() {
  return [...new Set(FUNDS.map(f => f['Categoría']).filter(Boolean))].sort();
}

function populateFilters() {
  const sel = document.getElementById('filter-category');
  getCategories().forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    sel.appendChild(opt);
  });
  document.getElementById('cat-count').textContent = getCategories().length;
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const cat = document.getElementById('filter-category').value;
  const minStars = parseInt(document.getElementById('filter-stars').value) || 0;

  filtered = FUNDS.filter(f => {
    if (q) {
      const hay = [f['Fondos Estrella'], f['ISIN'], f['Gestor'], f['Categoría']].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (cat && f['Categoría'] !== cat) return false;
    if ((f['Estrellas'] || 0) < minStars) return false;
    return true;
  });

  sortData();
  render();
  document.getElementById('fund-count').textContent = filtered.length;
}

function sortData() {
  const keyMap = {
    name: f => f['Fondos Estrella'] || '',
    category: f => f['Categoría'] || '',
    risk: f => f['Riesgo'] || 0,
    y1: f => f['1 Año'] || -Infinity,
    y3: f => f['3 Años'] || -Infinity,
    y5: f => f['5 Años'] || -Infinity,
    sharpe: f => f['Sharpe'] || -Infinity,
    stars: f => f['Estrellas'] || 0,
    vol: f => f['Volatilidad'] || 0
  };
  const getter = keyMap[sortKey] || keyMap.name;
  filtered.sort((a, b) => {
    let va = getter(a), vb = getter(b);
    if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortDir === 'asc' ? va - vb : vb - va;
  });
}

function render() {
  if (currentView === 'cards') renderCards();
  else renderTable();
}

function renderCards() {
  const container = document.getElementById('cards-view');
  container.innerHTML = filtered.map((f, i) => `
    <div class="card" data-idx="${i}">
      <div class="card-header">
        <h3 class="fund-name">${f['Fondos Estrella'] || 'Sin nombre'}</h3>
        <div class="stars">${'★'.repeat(f['Estrellas'] || 0)}${'☆'.repeat(5 - (f['Estrellas'] || 0))}</div>
      </div>
      <div class="category">${f['Categoría'] || '—'}</div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
        <span class="risk-badge">Riesgo ${f['Riesgo'] || '—'}</span>
        <span style="font-size:0.8rem; color:var(--muted); font-family:monospace;">${f['ISIN'] || ''}</span>
      </div>
      <div class="metrics">
        <div class="metric"><div class="metric-label">1 Año</div><div class="metric-value ${colorClass(f['1 Año'])}">${fmtPct(f['1 Año'])}</div></div>
        <div class="metric"><div class="metric-label">3 Años</div><div class="metric-value ${colorClass(f['3 Años'])}">${fmtPct(f['3 Años'])}</div></div>
        <div class="metric"><div class="metric-label">5 Años</div><div class="metric-value ${colorClass(f['5 Años'])}">${fmtPct(f['5 Años'])}</div></div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--muted);">
        <span>Sharpe <strong style="color:var(--text)">${fmtNum(f['Sharpe'])}</strong></span>
        <span>Vol <strong style="color:var(--text)">${fmtNum(f['Volatilidad'],1)}</strong></span>
        <span>PER <strong style="color:var(--text)">${fmtNum(f['PER'],1)}</strong></span>
      </div>
    </div>
  `).join('');

  container.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openModal(filtered[parseInt(card.dataset.idx)]));
  });
}

function renderTable() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = filtered.map((f, i) => `
    <tr data-idx="${i}" style="cursor:pointer;">
      <td><strong>${f['Fondos Estrella'] || ''}</strong></td>
      <td>${f['Categoría'] || ''}</td>
      <td>${f['Riesgo'] || '—'}</td>
      <td class="${colorClass(f['1 Año'])}">${fmtPct(f['1 Año'])}</td>
      <td class="${colorClass(f['3 Años'])}">${fmtPct(f['3 Años'])}</td>
      <td class="${colorClass(f['5 Años'])}">${fmtPct(f['5 Años'])}</td>
      <td>${fmtNum(f['Sharpe'])}</td>
      <td>${'★'.repeat(f['Estrellas'] || 0)}</td>
      <td>${fmtNum(f['Volatilidad'],1)}</td>
      <td style="font-family:monospace; font-size:0.78rem;">${f['ISIN'] || ''}</td>
    </tr>
  `).join('');

  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => openModal(filtered[parseInt(tr.dataset.idx)]));
  });

  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.remove('sorted-asc', 'sorted-desc');
    if (th.dataset.sort === sortKey) {
      th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
    }
  });
}

function openModal(fund) {
  const geo = [
    {key:'EEUU', label:'EEUU'},
    {key:'Europa', label:'Europa'},
    {key:'Otros Desarro', label:'Otros Desarro'},
    {key:'Emergentes', label:'Emergentes'}
  ];
  const sectors = [
    {key:'Tech', label:'Tech'},
    {key:'Salud', label:'Salud'},
    {key:'Finance', label:'Finance'},
    {key:'Com', label:'Com'},
    {key:'BsicMat', label:'BsicMat'},
    {key:'DefConsum', label:'DefConsum'},
    {key:'Energy', label:'Energy'},
    {key:'CiclicConsum', label:'CiclicConsum'},
    {key:'Industry', label:'Industry'},
    {key:'Inmobi', label:'Inmobi'},
    {key:'SerPub', label:'SerPub'}
  ];

  function makeBars(items) {
    return items.map(item => {
      const v = fund[item.key] || 0;
      const pct = (v * 100);
      const width = Math.min(pct, 100);
      return `
        <div class="bar-row">
          <div class="bar-label">${item.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
          <div class="bar-value">${fmtPct(v)}</div>
        </div>`;
    }).join('');
  }

  const starsHtml = '★'.repeat(fund['Estrellas'] || 0) + '☆'.repeat(5 - (fund['Estrellas'] || 0));

  const content = `
    <div class="ficha-label">FICHA DEL FONDO</div>
    <h2>${fund['Fondos Estrella']}</h2>
    <div class="meta">${fund['Categoría'] || '—'} · ${fund['ISIN'] || '—'}</div>
    <div class="gestor">Gestor: ${fund['Gestor'] || '—'} · Inicio: ${fund['Inicio'] || '—'} · Actualización: ${fund['Actualización'] || '—'}</div>

    <div class="section-title">Rentabilidad y ratios</div>
    <div class="metrics-grid">
      <div class="metric-card bg-green"><div class="label">1 Año</div><div class="value">${fmtPct(fund['1 Año'])}</div></div>
      <div class="metric-card bg-green"><div class="label">3 Años</div><div class="value">${fmtPct(fund['3 Años'])}</div></div>
      <div class="metric-card bg-green"><div class="label">5 Años</div><div class="value">${fmtPct(fund['5 Años'])}</div></div>
      <div class="metric-card bg-green"><div class="label">10 Años</div><div class="value">${fmtPct(fund['10 Años'])}</div></div>

      <div class="metric-card bg-red"><div class="label">PER</div><div class="value">${fmtNum(fund['PER'],2)}</div></div>
      <div class="metric-card bg-yellow"><div class="label">Sharpe</div><div class="value">${fmtNum(fund['Sharpe'])}</div></div>
      <div class="metric-card bg-red"><div class="label">Volatilidad</div><div class="value">${fmtNum(fund['Volatilidad'],2)}</div></div>
      <div class="metric-card bg-red"><div class="label">Costes</div><div class="value">${fmtNum(fund['Costes'],2)} %</div></div>

      <div class="metric-card bg-mint"><div class="label">Patrimonio (millones)</div><div class="value">${fmtInt(fund['Patrimonio'])}</div></div>
      <div class="metric-card bg-green"><div class="label">RV</div><div class="value">${fmtPct(fund['RV'])}</div></div>
      <div class="metric-card bg-light"><div class="label">RF</div><div class="value">${fmtPct(fund['RF'])}</div></div>
      <div class="metric-card bg-mint"><div class="label">Estrellas</div><div class="value">${starsHtml}</div></div>

      <div class="metric-card bg-mint"><div class="label">Alfa</div><div class="value">${fmtNum(fund['Alfa'])}</div></div>
      <div class="metric-card bg-light"><div class="label">Beta</div><div class="value">${fmtNum(fund['Beta'])}</div></div>
      <div class="metric-card bg-light"><div class="label">Alza</div><div class="value">${fund['Alza'] || '—'}</div></div>
      <div class="metric-card bg-light"><div class="label">Bajada</div><div class="value">${fund['Bajada'] || '—'}</div></div>

      <div class="metric-card bg-light"><div class="label">Drawdown</div><div class="value">${fmtPct(fund['Drawdown'])}</div></div>
      <div class="metric-card bg-light"><div class="label">Drawdown Cat</div><div class="value">${fmtPct(fund['Drawdown Cat'])}</div></div>
      <div class="metric-card bg-light"><div class="label">Peso Atc Investing</div><div class="value">0,00 %</div></div>
    </div>

    <div class="section-title">Distribución geográfica</div>
    ${makeBars(geo)}

    <div class="section-title">Distribución sectorial</div>
    ${makeBars(sectors)}
  `;

  document.getElementById('modal-content').innerHTML = content;
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}

// Events
document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('filter-category').addEventListener('change', applyFilters);
document.getElementById('filter-stars').addEventListener('change', applyFilters);

document.getElementById('btn-cards').addEventListener('click', () => {
  currentView = 'cards';
  document.getElementById('cards-view').classList.remove('hidden');
  document.getElementById('table-view').classList.add('hidden');
  document.getElementById('btn-cards').classList.remove('secondary');
  document.getElementById('btn-table').classList.add('secondary');
  render();
});
document.getElementById('btn-table').addEventListener('click', () => {
  currentView = 'table';
  document.getElementById('cards-view').classList.add('hidden');
  document.getElementById('table-view').classList.remove('hidden');
  document.getElementById('btn-table').classList.remove('secondary');
  document.getElementById('btn-cards').classList.add('secondary');
  render();
});

document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortKey = key; sortDir = key === 'name' || key === 'category' ? 'asc' : 'desc'; }
    sortData();
    render();
  });
});

document.getElementById('close-modal').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// Init
populateFilters();
applyFilters();
</script>
