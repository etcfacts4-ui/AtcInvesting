<title>ATC Investing · Acceso suscriptores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#111214;--sf:#1a1b1f;--bd:#2b2d32;--tx:#f2f5f3;--mu:#9aa6a0;--ac:#2fa571;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.box{width:100%;max-width:640px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.box img{display:block;width:100%;height:auto}
.in{padding:22px 24px 26px;text-align:center}
h1{font:600 20px "Outfit","Segoe UI",system-ui,sans-serif;margin:0 0 4px}
p{margin:0 0 16px;color:var(--mu);font-size:14px}
form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
input{flex:1 1 200px;max-width:300px;background:#0e0f11;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font:inherit;text-align:center;letter-spacing:.05em}
input:focus{outline:2px solid var(--ac);border-color:transparent}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:600 15px "Outfit","Segoe UI",system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#e{min-height:22px;margin-top:12px;color:#ee7468;font-size:13px}

const B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim().toLowerCase()),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:B(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:B(P.i)},k,B(P.c)));
}
function mostrar(html){document.open();document.write(html);document.close()}
async function entrar(pw,auto){
 const e=document.getElementById("e"),b=document.getElementById("b");
 if(!window.crypto||!crypto.subtle){e.textContent="Tu navegador no permite el acceso desde esta dirección. Abre la página con https.";return}
 b.disabled=true;e.textContent="";
 try{const h=await abrir(pw);try{sessionStorage.setItem("atc_k",pw)}catch(x){}mostrar(h)}
 catch(x){b.disabled=false;try{sessionStorage.removeItem("atc_k")}catch(y){}if(!auto){e.textContent="Clave incorrecta. Inténtalo de nuevo.";document.getElementById("k").select()}}
}
document.getElementById("f").addEventListener("submit",ev=>{ev.preventDefault();entrar(document.getElementById("k").value,false)});
try{const s=sessionStorage.getItem("atc_k");if(s)entrar(s,true)}catch(x){}
