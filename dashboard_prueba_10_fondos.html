V.ley=()=>D.ley.map(g=>`<div class="card"><h3>${esc(g.h[0])}</h3><table class="alt">${`<tr><th>${esc(g.h[0])}</th><th style="text-align:left">${esc(g.h[1])}</th></tr>`+g.r.map(r=>`<tr><td class="${r[0]==="Fondo Índice"?"ix":""}"><b>${esc(r[0])}</b></td><td class="l" style="white-space:normal;text-align:left">${esc(r[1])}</td></tr>`).join("")}</table></div>`).join("");

const bar=(l,v,mx=1)=>isn(v)?`<div class="br"><span>${l}</span><i><u style="width:${Math.min(100,Math.max(0,v/mx*100))}%"></u></i><b>${pc(v)}</b></div>`:"";
const kp=(f,k,l)=>{const c=CK[k],bg=c[3]?c[3](f[k]):"",fc=fcol(f,k);return `<div class="k ${bg?"cl":""}" style="${bg?`background:${bg};border-color:${bg};color:#16202c`:""}"><small>${l||c[1]}${f.u&&f.u.includes(k)?" †":""}</small><b${fc&&!bg?` style="color:${fc}"`:""}>${esc(c[2]?c[2](f[k]):f[k]??"–")}</b></div>`};
const REG=[["us","EEUU"],["eu","Europa"],["od","Otros desarrollados"],["em","Emergentes"]],SEC=[["tech","Tecnología"],["sal","Salud"],["fin","Finanzas"],["com","Comunicaciones"],["mat","Mat. básicos"],["def","Cons. defensivo"],["ene","Energía"],["cic","Cons. cíclico"],["ind","Industria"],["inm","Inmobiliario"],["pub","Serv. públicos"]];
const charts=g=>`<div class="g2"><div><div class="card"><h3>Rentabilidad anualizada</h3>${[["r1","1 año"],["r3","3 años"],["r5","5 años"],["r10","10 años"]].map(([k,l])=>{const v=g(k);return isn(v)&&v?bar(l,Math.max(0,v),.4):""}).join("")}</div><div class="card"><h3>Exposición por región</h3>${REG.map(([k,l])=>bar(l,g(k))).join("")}</div></div><div class="card"><h3>Exposición por sector</h3>${SEC.map(([k,l])=>bar(l,g(k))).join("")}</div></div>`;
